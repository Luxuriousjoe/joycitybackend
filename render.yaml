services:
  - type: web
    name: grace-church-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run db:migrate && npm run admin:bootstrap && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: joy-city-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: EMAIL_VERIFICATION_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_DRIVE_ENABLED
        value: "true"
      - key: GOOGLE_DRIVE_AUTH_MODE
        value: oauth
      - key: GOOGLE_DRIVE_CLIENT_ID
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_DRIVE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_REDIRECT_URI
        value: https://developers.google.com/oauthplayground
      - key: GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: GOOGLE_DRIVE_MEDIA_FOLDER_ID
        sync: false
      - key: GOOGLE_DRIVE_PHOTO_FOLDER_ID
        sync: false
      - key: GOOGLE_DRIVE_VIDEO_FOLDER_ID
        sync: false
      - key: GOOGLE_DRIVE_AUDIO_FOLDER_ID
        sync: false
      - key: GOOGLE_DRIVE_THUMBNAIL_FOLDER_ID
        sync: false
      - key: GOOGLE_DRIVE_PUBLIC_FILES
        value: "true"
      - key: MAX_FILE_SIZE_MB
        value: "500"
databases:
  - name: joy-city-postgres
    plan: free
    databaseName: joy_city
    user: joy_city_api
