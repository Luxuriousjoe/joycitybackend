services:
  - type: web
    name: joy-city-international-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run db:migrate && npm run admin:bootstrap && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: joy-city-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

databases:
  - name: joy-city-postgres
    plan: free
    databaseName: joy_city
    user: joy_city_api
